name: CI-CD Billing Service

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 993263774593.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: oficina48-billing-service
  CLUSTER_NAME: oficina48-eks

jobs:

  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build e Testes
        run: mvn -B clean verify

  deploy:
    runs-on: ubuntu-latest
    needs: build-test

    steps:

      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e Push Docker
        run: |
          IMAGE_TAG=${GITHUB_SHA}

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

          docker build \
            -t $ECR_REPOSITORY:$IMAGE_TAG .

          docker tag \
            $ECR_REPOSITORY:$IMAGE_TAG \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $CLUSTER_NAME

      - name: Apply ConfigMap
        env:
          RDS_ENDPOINT: ${{ secrets.RDS_ENDPOINT }}
          SQS_ENDPOINT: ${{ secrets.SQS_ENDPOINT }}
        run: |
          envsubst < k8s/configmap.yaml.tpl | kubectl apply -f -

      - name: Apply Secret
        run: |
          kubectl create secret generic billing-service-secret \
            --from-literal=SPRING_DATASOURCE_PASSWORD='${{ secrets.DB_PASSWORD }}' \
            --from-literal=NEW_RELIC_LICENSE_KEY='${{ secrets.NEW_RELIC_LICENSE_KEY }}' \
            --from-literal=MRCPAGO_ACCESS_TOKEN='${{ secrets.MRCPAGO_ACCESS_TOKEN }}' \
            --from-literal=MRCPAGO_PUBLIC_KEY='${{ secrets.MRCPAGO_PUBLIC_KEY }}' \
            --from-literal=MRCPAGO_PRIVATE_KEY='${{ secrets.MRCPAGO_PRIVATE_KEY }}' \
            --from-literal=MRCPAGO_CLIENT_SECRETS='${{ secrets.MRCPAGO_CLIENT_SECRETS }}' \
            --from-literal=MRCPAGO_WEBHOOK_URL='${{ secrets.MRCPAGO_WEBHOOK_URL }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Application
        run: |
          sed "s/__IMAGE_TAG__/${IMAGE_TAG}/g" \
            k8s/deployment.yaml | kubectl apply -f -

          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Rollout
        run: |
          kubectl rollout restart deployment/billing-service

          kubectl rollout status \
            deployment/billing-service \
            --timeout=200s
      - name: Rollout
        run: |
          kubectl rollout restart deployment/billing-service
          
          kubectl rollout status \
            deployment/billing-service \
            --timeout=250s

      - name: Debug Rollout (se falhar)
        if: failure()
        run: |
          echo "### 🔴 DIAGNÓSTICO DO ROLLOUT" >> $GITHUB_STEP_SUMMARY

          echo "---- PODS ----"
          kubectl get pods -l app=billing-service -o wide

          echo "---- DESCRIBE DOS PODS ----"
          for pod in $(kubectl get pods -l app=billing-service -o jsonpath='{.items[*].metadata.name}'); do
            echo "===== $pod ====="
            kubectl describe pod "$pod"
          done

          echo "---- EVENTOS DO NAMESPACE (últimos) ----"
          kubectl get events --sort-by='.lastTimestamp' | tail -n 40

          echo "---- LOGS ATUAIS ----"
          kubectl logs -l app=billing-service --tail=200 --all-containers || true

          echo "---- LOGS DO CONTAINER ANTERIOR (se crashou) ----"
          for pod in $(kubectl get pods -l app=billing-service -o jsonpath='{.items[*].metadata.name}'); do
            echo "===== $pod (previous) ====="
            kubectl logs "$pod" --previous --all-containers || true
          done

          echo "---- STATUS DO DEPLOYMENT ----"
          kubectl get deployment billing-service -o wide
          kubectl describe deployment billing-service

      - name: Aguarda LoadBalancer
        id: lb
        run: |

          echo "Aguardando LoadBalancer..."

          for i in {1..30}; do

            HOSTNAME=$(kubectl get svc billing-service \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' \
              2>/dev/null || true)

            if [ -n "$HOSTNAME" ]; then
              echo "url=$HOSTNAME" >> $GITHUB_OUTPUT
              echo "LB URL: $HOSTNAME"
              exit 0
            fi

            echo "Tentativa $i..."
            sleep 15

          done

          exit 1

      - name: Exibe URL da LoadBalancer
        run: |
          URL="${{ steps.lb.outputs.url }}"
          echo "### 🔗 Billing Service - LoadBalancer URL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`http://${URL}\`" >> $GITHUB_STEP_SUMMARY

      - name: Instala PyNaCl
        run: pip install PyNaCl

      - name: Atualiza BILLING_SERVICE_URL no repo API Gateway
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          BILLING_SERVICE_URL: ${{ steps.lb.outputs.url }}
          APP_REPO: GabrielSRezende/Oficina48_InfraAPIGateway

        run: |
          set -euo pipefail

          PUB_KEY_RESPONSE=$(curl -s \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${APP_REPO}/actions/secrets/public-key")

          KEY_ID=$(echo "$PUB_KEY_RESPONSE" | jq -r '.key_id')
          PUBLIC_KEY=$(echo "$PUB_KEY_RESPONSE" | jq -r '.key')

          ENCRYPTED=$(PUBLIC_KEY="${PUBLIC_KEY}" \
            SECRET_VALUE="${BILLING_SERVICE_URL}" \
            python3 scripts/encrypt_secret.py)

          curl -s -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${APP_REPO}/actions/secrets/BILLING_SERVICE_URL" \
            -d "{\"encrypted_value\":\"${ENCRYPTED}\",\"key_id\":\"${KEY_ID}\"}"

          echo "Secret BILLING_SERVICE_URL atualizado"

      - name: Status do Cluster
        if: always()
        run: |
          kubectl get pods -o wide || true
          kubectl get svc -o wide || true
          kubectl get hpa -o wide || true

      - name: Logs da Aplicacao
        if: always()
        run: |
          kubectl logs \
            -l app=billing-service \
            --tail=100 || true