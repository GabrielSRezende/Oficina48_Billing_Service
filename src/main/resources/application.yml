server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: oficina48-billing-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/oficina48_billing}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:test}
        secret-key: ${AWS_SECRET_ACCESS_KEY:test}
      sqs:
        endpoint: ${AWS_SQS_ENDPOINT:http://localhost:4566}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  base-url: ${BILLING_BASE_URL:oficina48_billing.com.br}
  documentos:
    path: ${BILLING_DOCUMENTOS_PATH:./documentos}
  sqs:
    queues:
      faturamento-solicitado: ${SQS_QUEUE_FATURAMENTO_SOLICITADO:faturamento-solicitado}
      faturamento-pendente: ${SQS_QUEUE_FATURAMENTO_PENDENTE:faturamento-pendente}
      faturamento-concluido: ${SQS_QUEUE_FATURAMENTO_CONCLUIDO:faturamento-concluido}
      faturamento-falhou: ${SQS_QUEUE_FATURAMENTO_FALHOU:faturamento-falhou}
      orcamento-solicitado: ${SQS_QUEUE_ORCAMENTO_SOLICITADO:orcamento-solicitado}
      orcamento-aprovado: ${SQS_QUEUE_ORCAMENTO_APROVADO:orcamento-aprovado}
      orcamento-reprovado: ${SQS_QUEUE_ORCAMENTO_REPROVADO:orcamento-reprovado}
  os-service:
    base-url: ${OS_SERVICE_BASE_URL:http://localhost:8080}
    callback-path: ${OS_SERVICE_CALLBACK_PATH:/api/ordens-servico/faturamento/resultado}
    connect-timeout: ${OS_SERVICE_CONNECT_TIMEOUT:2s}
    read-timeout: ${OS_SERVICE_READ_TIMEOUT:5s}
  saga:
    callback-retry:
      fixed-delay: ${SAGA_CALLBACK_RETRY_FIXED_DELAY:30000}
      initial-delay: ${SAGA_CALLBACK_RETRY_INITIAL_DELAY:10000}
      max-attempts: ${SAGA_CALLBACK_RETRY_MAX_ATTEMPTS:5}

queue:
  diagnostico-solicitado: ${QUEUE_DIAGNOSTICO_SOLICITADO:diagnostico-solicitado}
  execucao-solicitada: ${QUEUE_EXECUCAO_SOLICITADA:execucao-solicitada}
  falha-execution-service: ${QUEUE_FALHA_EXECUTION_SERVICE:falha-execution-service}
  orcamento-reprovado: ${QUEUE_ORCAMENTO_REPROVADO:orcamento-reprovado}
  faturamento-concluido: ${QUEUE_FATURAMENTO_CONCLUIDO:faturamento-concluido}
  execucao-finalizada: ${QUEUE_EXECUCAO_FINALIZADA:execucao-finalizada}
  diagnostico-finalizado: ${QUEUE_DIAGNOSTICO_FINALIZADO:diagnostico-finalizado}
  orcamento-aprovado: ${QUEUE_ORCAMENTO_APROVADO:orcamento-aprovado}
  orcamento-solicitado: ${QUEUE_ORCAMENTO_SOLICITADO:orcamento-solicitado}
  faturamento-solicitado: ${QUEUE_FATURAMENTO_SOLICITADO:faturamento-solicitado}
  faturamento-pendente: ${QUEUE_FATURAMENTO_PENDENTE:faturamento-pendente}
  faturamento-falhou: ${QUEUE_FATURAMENTO_FALHOU:faturamento-falhou}

mercadopago:                         
  access-key: ${MRCPAGO_ACCESS_TOKEN:}
  webhook-url: ${MRCPAGO_WEBHOOK_URL:https://sua-url-ngrok.ngrok-free.app/api/mercadopago/webhook}
  public-key: ${MRCPAGO_PUBLIC_KEY:}
  private-key: ${MRCPAGO_PRIVATE_KEY:}
  client-secrets: ${MRCPAGO_CLIENT_SECRETS:dummy_secret}
  enforce-signature: ${MRCPAGO_ENFORCE_SIGNATURE:false}

logging:
  level:
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: TRACE
