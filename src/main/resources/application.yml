spring:
  application:
    name: oficina48-billing-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oficina48_billing}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      missing-topics-fatal: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  kafka:
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:oficina48-billing-service}
    topics:
      faturamento-solicitado: ${KAFKA_TOPIC_FATURAMENTO_SOLICITADO:faturamento-solicitado}
      faturamento-concluido: ${KAFKA_TOPIC_FATURAMENTO_CONCLUIDO:faturamento-concluido}
      faturamento-falhou: ${KAFKA_TOPIC_FATURAMENTO_FALHOU:faturamento-falhou}
  os-service:
    base-url: ${OS_SERVICE_BASE_URL:http://localhost:8081}
    callback-path: ${OS_SERVICE_CALLBACK_PATH:/api/ordens-servico/faturamento/resultado}
    connect-timeout: ${OS_SERVICE_CONNECT_TIMEOUT:2s}
    read-timeout: ${OS_SERVICE_READ_TIMEOUT:5s}
  saga:
    callback-retry:
      fixed-delay: ${SAGA_CALLBACK_RETRY_FIXED_DELAY:30000}
      initial-delay: ${SAGA_CALLBACK_RETRY_INITIAL_DELAY:10000}
      max-attempts: ${SAGA_CALLBACK_RETRY_MAX_ATTEMPTS:5}
