spring:
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
      missing-topics-fatal: false
  datasource:
    url: jdbc:h2:mem:oficina48_billing_test;DB_CLOSE_DELAY=-1
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

app:
  kafka:
    consumer:
      group-id: oficina48-billing-service-test
    topics:
      faturamento-solicitado: faturamento-solicitado-test
      faturamento-concluido: faturamento-concluido-test
      faturamento-falhou: faturamento-falhou-test
  os-service:
    base-url: http://localhost:8081
    callback-path: /api/ordens-servico/faturamento/resultado
    connect-timeout: 2s
    read-timeout: 5s
  saga:
    callback-retry:
      fixed-delay: 30000
      initial-delay: 10000
      max-attempts: 3
