apiVersion: apps/v1
kind: Deployment

metadata:
  name: billing-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: billing-service

  template:
    metadata:
      labels:
        app: billing-service

    spec:
      containers:
        - name: billing-service

          image: 993263774593.dkr.ecr.us-east-1.amazonaws.com/oficina48-billing-service:__IMAGE_TAG__

          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: billing-service-config
            - secretRef:
                name: billing-service-secret

          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 512Mi

          startupProbe:
            httpGet:
              path: /api/actuator/health
              port: 8080
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 3

          readinessProbe:
            httpGet:
              path: /api/actuator/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /api/actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"

            - name: NEW_RELIC_APP_NAME
              value: "oficina48-billing-service"

            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: billing-service-secret
                  key: NEW_RELIC_LICENSE_KEY